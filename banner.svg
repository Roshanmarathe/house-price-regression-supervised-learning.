<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="House Price Prediction – Ames Housing machine learning regression project">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#1a1650"/>
      <stop offset="1" stop-color="#0a3a5a"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.55" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a3e635"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="40 40" dur="8s" repeatCount="indefinite"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect width="1200" height="320" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>

    <!-- drifting colour glows -->
    <circle cx="180" cy="80" r="110" fill="#38bdf8" opacity="0.28" filter="url(#blur)">
      <animate attributeName="cx" values="180;420;180" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="80;130;80" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1000" cy="250" r="130" fill="#a78bfa" opacity="0.30" filter="url(#blur)">
      <animate attributeName="cx" values="1000;800;1000" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="250;190;250" dur="10s" repeatCount="indefinite"/>
    </circle>

    <!-- rising price trend line -->
    <g transform="translate(700 40)">
      <polyline points="0,200 80,175 160,185 240,130 320,110 400,70 470,40"
                fill="none" stroke="url(#line)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"
                stroke-dasharray="700" stroke-dashoffset="700" filter="url(#glow)">
        <animate attributeName="stroke-dashoffset" values="700;0;0;700" keyTimes="0;0.45;0.9;1" dur="7s" repeatCount="indefinite"/>
      </polyline>
      <g fill="#ffffff">
        <circle cx="0" cy="200" r="5"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.02;0.9;1" dur="7s" repeatCount="indefinite"/></circle>
        <circle cx="160" cy="185" r="5"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2;0.25;0.9;1" dur="7s" repeatCount="indefinite"/></circle>
        <circle cx="320" cy="110" r="5"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.33;0.38;0.9;1" dur="7s" repeatCount="indefinite"/></circle>
        <circle cx="470" cy="40" r="7" fill="#a3e635"><animate attributeName="r" values="7;11;7" dur="1.6s" repeatCount="indefinite"/></circle>
      </g>
    </g>

    <!-- floating house -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="1010 150;1010 138;1010 150" dur="4s" repeatCount="indefinite"/>
      <polygon points="0,60 60,8 120,60" fill="#38bdf8" opacity="0.95"/>
      <rect x="14" y="60" width="92" height="70" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
      <rect x="50" y="88" width="22" height="42" rx="3" fill="#38bdf8" opacity="0.85"/>
      <rect x="26" y="76" width="16" height="16" rx="2" fill="#fbbf24" opacity="0.95">
        <animate attributeName="opacity" values="0.95;0.45;0.95" dur="3s" repeatCount="indefinite"/>
      </rect>
      <rect x="80" y="76" width="16" height="16" rx="2" fill="#fbbf24" opacity="0.95">
        <animate attributeName="opacity" values="0.45;0.95;0.45" dur="3s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- floating price tag -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="1100 110;1100 98;1100 110" dur="3.2s" repeatCount="indefinite"/>
      <circle r="26" fill="#fbbf24" filter="url(#glow)"/>
      <text text-anchor="middle" y="10" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#1f2937">$</text>
    </g>

    <!-- text -->
    <text x="60" y="120" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="6" fill="#7dd3fc">MACHINE LEARNING REGRESSION</text>
    <text x="60" y="190" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="68" font-weight="800" fill="url(#title)">House Price Prediction</text>
    <text x="62" y="232" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#cbd5e1">Ames Housing  •  Feature Engineering  •  XGBoost  •  scikit-learn Pipeline</text>

    <!-- cycling taglines -->
    <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#a5b4fc" font-style="italic">
      <text x="62" y="278" opacity="0">From raw property data to explainable price estimates
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.28;0.33;1" dur="9s" begin="0s" repeatCount="indefinite"/>
      </text>
      <text x="62" y="278" opacity="0">5 models compared with RMSE, MAE, R² and 5-fold CV
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.28;0.33;1" dur="9s" begin="3s" repeatCount="indefinite"/>
      </text>
      <text x="62" y="278" opacity="0">Residual analysis, feature importance and a reusable saved pipeline
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.28;0.33;1" dur="9s" begin="6s" repeatCount="indefinite"/>
      </text>
    </g>
  </g>
  <rect x="1" y="1" width="1198" height="318" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
</svg>
