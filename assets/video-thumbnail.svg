<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-label="Project demo video thumbnail placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#1a1650"/></linearGradient>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="40 40" dur="8s" repeatCount="indefinite"/>
    </pattern>
  </defs>
  <rect width="1000" height="460" rx="24" fill="url(#bg)"/>
  <rect width="1000" height="460" rx="24" fill="url(#g)"/>
  <rect x="1" y="1" width="998" height="458" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2"/>
  <circle cx="500" cy="200" r="62" fill="#ef4444" opacity="0.25"><animate attributeName="r" values="62;92;62" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.35;0;0.35" dur="2.4s" repeatCount="indefinite"/></circle>
  <circle cx="500" cy="200" r="58" fill="#ef4444"/>
  <polygon points="485,170 485,230 538,200" fill="#ffffff"/>
  <text x="500" y="320" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#f1f5f9">Project Demo Video</text>
  <text x="500" y="358" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#94a3b8">Data → Features → Models → Residuals → Saved Pipeline</text>
  <text x="500" y="420" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#64748b">Replace this image with a screenshot of your video once it is uploaded</text>
</svg>
